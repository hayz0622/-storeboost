name: Deploy StoreBoost to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build StoreBoost site
        run: |
          rm -rf _site
          mkdir -p _site
          cat .deploy/part*.b64 | base64 --decode > /tmp/storeboost-base.zip
          unzip -q /tmp/storeboost-base.zip -d _site
          cat .deploy/overlay[0-9][0-9].b64 | base64 --decode > /tmp/storeboost-overlay.zip
          unzip -qo /tmp/storeboost-overlay.zip -d _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
