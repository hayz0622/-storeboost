name: Deploy StoreBoost to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild exact StoreBoost final site
        run: |
          rm -rf _site
          mkdir -p _site
          cat             .deploy/sync00a.b64 .deploy/sync00b.b64 .deploy/sync00c.b64 .deploy/sync00d.b64             .deploy/sync01a.b64 .deploy/sync01b.b64 .deploy/sync01c.b64 .deploy/sync01d.b64             .deploy/final02.b64 .deploy/final03.b64 .deploy/final04.b64             .deploy/sync05a.b64 .deploy/sync05b.b64 .deploy/sync05c.b64 .deploy/sync05d.b64             .deploy/sync06a.b64 .deploy/sync06b.b64 .deploy/sync06c.b64 .deploy/sync06d.b64             | base64 --decode > /tmp/storeboost-final.zip
          echo "91256753e2069a49fe43e89b0b7dec8e9d9c954f4686cea66892cb2f2095b300  /tmp/storeboost-final.zip" | sha256sum -c -
          unzip -t /tmp/storeboost-final.zip
          unzip -q /tmp/storeboost-final.zip -d _site
          test -f _site/index.html
          test -f _site/assets/logo.webp
          test -f _site/product-audit-checklist.html
          test -f _site/product-launch-qa.html
          test -f _site/product-cro-toolkit.html
          test -f _site/product-bundle.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
